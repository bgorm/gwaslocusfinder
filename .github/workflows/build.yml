name: Build and test plugin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        pgen: [0, 1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify native Apple Silicon PGEN runner
        if: runner.os == 'macOS' && matrix.pgen == 1
        run: test "$(uname -m)" = arm64
      - name: Install build dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y g++ make pkg-config zlib1g-dev libzstd-dev python3
          else
            brew install pkgconf zlib zstd
            echo "PKG_CONFIG_PATH=$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix zstd)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          fi
      - name: Build matching bcftools and HTSlib
        shell: bash
        run: |
          deps="$RUNNER_TEMP/gwaslocusfinder-deps"
          mkdir -p "$deps"
          cd "$deps"
          curl -fL --retry 2 https://github.com/samtools/htslib/releases/download/1.25/htslib-1.25.tar.bz2 -o htslib.tar.bz2
          curl -fL --retry 2 https://github.com/samtools/bcftools/releases/download/1.25/bcftools-1.25.tar.bz2 -o bcftools.tar.bz2
          tar -xjf htslib.tar.bz2
          tar -xjf bcftools.tar.bz2
          export CPPFLAGS="$(pkg-config --cflags zlib libzstd)"
          export LDFLAGS="$(pkg-config --libs-only-L zlib libzstd)"
          cd "$deps/htslib-1.25"
          ./configure --disable-libcurl --disable-s3 --disable-gcs --disable-bz2 --disable-lzma --without-libdeflate
          make -j2
          cd "$deps/bcftools-1.25"
          ./configure --with-htslib="$deps/htslib-1.25" --prefix="$deps/install"
          make -j2
          make install
          echo "$deps/install/bin" >> "$GITHUB_PATH"
          echo "PLUGIN_HTSLIB=$deps/htslib-1.25" >> "$GITHUB_ENV"
      - name: Build and test
        shell: bash
        env:
          WITH_PGEN: ${{ matrix.pgen }}
          JOBS: 2
        run: |
          bash scripts/bootstrap.sh
          make test WITH_PGEN="$WITH_PGEN"
      - name: Export and test public source tree
        shell: bash
        env:
          WITH_PGEN: ${{ matrix.pgen }}
        run: |
          make export EXPORT_DIR="$RUNNER_TEMP/plugin-source"
          cd "$RUNNER_TEMP/plugin-source"
          PGENLIB="$GITHUB_WORKSPACE/vendor/plink-ng-4544f92e374e784a6ffd97fa88239962b81f2b62/2.0/include" make -j2 test WITH_PGEN="$WITH_PGEN"
